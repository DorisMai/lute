%YAML 1.3
---
title: "T-Jump Analysis Configuration"
experiment: "{{ $EXPERIMENT }}"
run: "{{ $RUN_NUM }}"
date: "2025/08/15"
lute_version: 0.1      # Do not be change unless need to force older version
task_timeout: 6000
work_dir: ""
...
---
TJump:
  # REQUIRED: Path to your custom processing script
  # python_script: "/sdf/data/lcls/ds/mfx/{{ $EXPERIMENT }}/results/doris/tjump_LUTE/sd2qwp1.py"
  python_script: "/sdf/data/lcls/ds/mfx/{{ $EXPERIMENT }}/results/doris/tjump_LUTE/smalldata_to_Tval_multimethod.py"
  
  # OPTIONAL: Input from previous smalldata task. If not provided, LUTE validator and/or the 
  # TJump script defaults to the following
  # input_h5: "/sdf/data/lcls/ds/mfx/{{ $EXPERIMENT }}/hdf5/smalldata/{{ $EXPERIMENT }}_Run{{ $RUN_NUM:04d }}.h5"
  
  # OPTIONAL: Output directory for results, default to the following
  # output_dir: "/sdf/data/lcls/ds/mfx/{{ $EXPERIMENT }}/stats/summary/TJump/{{ $RUN_NUM:04d }}"
  
  # OPTIONAL: Output h5 file name, default to the following
  # output_h5: "run{{ $RUN_NUM:04d }}_sd2qwp1.hdf5"

  # OPTIONAL: Peak fitting method: 'simple' or 'spline' or 'two_peak_fit' (default=simple). 
  # Not applicable to sd2qwp1.py script.
  # peakfit: "spline"

ClassifyTJump:
  # REQUIRED: Path to the classification script
  python_script: "/sdf/data/lcls/ds/mfx/{{ $EXPERIMENT }}/results/doris/classify_tjump.py"

  # OPTIONAL: Input from previous smalldata task. If not provided, LUTE validator and/or the 
  # TJump script defaults to the following
  # input_h5: "run{{ $RUN_NUM:04d }}_sd2qwp1.hdf5"

  # OPTIONAL: Output png file name, default to the following
  # output_png: "run{{ $RUN_NUM:04d }}_tjump_classifier.png"

  # OPTIONAL: Output directory for results, default to the following
  # output_dir: "/sdf/data/lcls/ds/mfx/{{ $EXPERIMENT }}/stats/summary/TJumpClassification/{{ $RUN_NUM:04d }}"

  # OPTIONAL: Output csv file name, default to the following
  # output_csv: "run{{ $RUN_NUM:04d }}_tjump_classifier.csv"


SubmitSMD:
  producer: "/sdf/data/lcls/ds/mfx/{{ $EXPERIMENT }}/results/smalldata_tools/lcls1_producers/smd_producer.py"
... 
